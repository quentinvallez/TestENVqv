name: Listing count
# One-off: reads caenen.be's overviews and listing pages with plain HTTP and prints one JSON line per listing.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/site_explore.py", "scripts/caenen_count.py", ".github/workflows/listing-count.yml"]
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Count
        run: python3 scripts/site_explore.py
