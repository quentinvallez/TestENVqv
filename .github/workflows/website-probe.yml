name: Website probe
# Development aid: reads the listing overviews of a few agency sites (robots.txt obeyed) and prints
# what it finds. Stores nothing.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: Only the planned sites whose address contains these words (space separated)
        required: false
  push:
    branches: ["claude/**"]
    paths: ["packages/core/scripts/probe-websites.ts", "packages/core/src/website/**", ".github/workflows/website-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        run: npx -y tsx@4.20.6 packages/core/scripts/probe-websites.ts ${{ github.event.inputs.sites }}
